name: Preserve already-measured public Short sidecars (no media transfer)
on:
  push:
    branches:
      - gpt/public-one-shot-short-audit-20261113
    paths:
      - .github/workflows/recover_short_sidecars.yml

permissions:
  actions: read
  contents: write

jobs:
  recover-measured-rows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Recover only verified analysis sidecars from prior artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p short-audit/results
          curl --fail --silent --show-error --location --retry 1 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14032385021/zip" \
            -o /tmp/short-rows.zip
          unzip -t /tmp/short-rows.zip | tail -1
          unzip -o -q /tmp/short-rows.zip -d short-audit/results
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('short-audit/results')
          s=json.loads((p/'summary.json').read_text())
          assert s['video_id']=='BaE0Meum0oc' and s['frame_count']==1198
          assert sum(1 for _ in (p/'frames.jsonl').open())==1198
          assert sum(1 for _ in (p/'features.jsonl').open())==1198
          assert sum(1 for _ in (p/'audio_20ms.jsonl').open())==1005
          assert not any(x.suffix in ('.mp4','.mov') for x in p.iterdir())
          print('EVIDENCE_ROWS_OK',s['frame_count'],s['media_sha256'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add short-audit/results/
          git commit -m 'Save genuine 1198-frame and 1005-audio-window measurements (no source media)'
          git push origin HEAD:gpt/public-one-shot-short-audit-20261113
