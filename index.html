/* 포장지 콜라주: 안에 담긴 최근 사진 큰 것 1장 + 작은 것 2장 */
.col{display:grid;gap:2px;aspect-ratio:3/2;width:100%;border-radius:14px;overflow:hidden;background:var(--chrome-2);transition:filter .15s}
.col img{width:100%!important;height:100%!important;object-fit:cover!important;display:block;min-height:0}
.col.n2{grid-template-columns:1fr 1fr}
.col.n3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}.col.n3 img:first-child{grid-row:1/3}
.col.none{place-items:center;background:rgba(255,255,255,.5);border:1px dashed var(--line)}
.col.none img{width:56%!important;height:56%!important;object-fit:contain!important}
.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px 14px}
.ctiles .crow{display:grid;gap:6px;border:0;padding:0;align-content:start}
.ctiles .crow-main{display:grid;gap:8px;padding:0;align-items:start}
.ctiles .crow-main:hover{background:none}.ctiles .crow-main:hover .col{filter:brightness(.92)}
.ctiles .crow-main .meta{padding:0 2px}
.ctiles .crow-main .t{display:flex;align-items:center;gap:6px;min-width:0}
.ctiles .crow-main .t img.ci{width:28px;height:15px;object-fit:contain;flex:none}
.ctiles .home-toggle{padding:0 2px;font-size:12px}
.lock{display:inline-flex;width:14px;height:14px;color:var(--ink-2);flex:none}.lock svg{width:100%;height:100%}
.mobile .ctiles{grid-template-columns:1fr 1fr;gap:16px 10px}
.vfilter{display:inline-flex;gap:4px}
.awrap.tile{width:150px;justify-items:stretch;padding:6px;gap:6px;text-align:left}
.awrap.tile .an{padding:0 4px 2px;font-weight:600}
.mobile .awrap.tile{width:calc(50% - 4px)}
.fs-card{background:var(--chrome);border:1px solid var(--line);border-radius:12px;padding:14px}
.fs-card h4{margin:0 0 8px;font-size:13px;color:var(--ink-2);font-weight:600}
.fs-me{display:flex;align-items:center;gap:12px}
.fs-me .me-photo{width:56px;height:56px}.fs-me .me-photo .ini{font-size:24px}
.fs-me .me-name{font-size:18px}.fs-me .me-status{font-size:13px}
.fs-me.edit{width:100%;border:0;background:none;padding:4px;margin:-4px;border-radius:10px;text-align:left;color:var(--ink);cursor:pointer;width:calc(100% + 8px)}
.fs-me.edit:hover{background:var(--chrome-2)}
.fs-me .me-text{flex:1;min-width:0}
.fs-me .me-photo{position:relative;overflow:visible}.fs-me .me-photo>img,.fs-me .me-photo>.ini{border-radius:50%}
.fs-me .cam{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--chrome);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2)}
.fs-me .cam svg{width:13px;height:13px}
.fs-edit{flex:none;font-size:12px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--chrome)}
.fs-me.edit:hover .fs-edit{color:var(--ink);border-color:var(--ink-2)}
.fs-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.fs-row{display:flex;align-items:center;gap:10px;width:100%;padding:7px 4px;border:0;background:none;border-radius:6px;text-align:left;color:var(--ink);font-size:13.5px}
.fs-row:hover{background:var(--chrome-2)}
.fs-row img{width:40px;height:22px;object-fit:contain;flex:none}
.fs-row span{flex:none}.fs-row small{margin-left:auto;color:var(--ink-2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fmore{text-align:center;margin-top:18px}.fend{text-align:center;color:var(--ink-2);margin-top:22px}
.fnote{text-align:center;margin-top:10px}
.wrapto.visit{margin-top:10px}
.aspace{max-width:720px;margin:0 auto}
.aspace-me{margin:0 0 14px;cursor:default}
.aspace-me .fav{font-size:28px}
.aspace-me .follow{margin-left:auto;align-self:center}
.aw{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.awrap{display:grid;justify-items:center;gap:4px;width:92px;padding:8px 4px;border:1px solid transparent;border-radius:10px;background:rgba(255,255,255,.55);font-size:12.5px;color:#1b2230}
.awrap.on{border-color:#1b2230;background:rgba(255,255,255,.85)}
.awrap img{width:70px;height:40px;object-fit:contain}
.awrap .stack{position:relative;width:70px;height:40px;display:block}.awrap .stack img{position:absolute;left:0;height:14px}
.awrap .stack img:nth-child(1){top:0}.awrap .stack img:nth-child(2){top:13px}.awrap .stack img:nth-child(3){top:26px}
.atitle{font-size:15px;margin:6px 2px 8px;color:#1b2230}
.alist{background:var(--chrome);border:1px solid var(--line);border-radius:12px;padding:2px 12px}
.recinfo{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;margin:0;display:grid;gap:8px}
.recinfo legend{font-size:12.5px;color:var(--ink-2);padding:0 4px}
.recinfo input[type=date]{border:1px solid var(--line);border-radius:8px;background:var(--chrome);padding:6px 8px;color:var(--ink);font-size:14px}
.recinfo select{width:auto}
.pf-row{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.pf-row .me-photo{width:64px;height:64px}

.editing #desk{background-image:none}
.editing #canvas::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.35) 1px,transparent 1px);background-size:16px 16px;pointer-events:none}

/* 편집 바 / 방문자 배너 */
.topbar{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:5000;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;border-radius:999px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow);white-space:nowrap;max-width:calc(100% - 24px);overflow-x:auto}
.topbar strong{font-family:var(--f-display);font-weight:400;font-size:16px;margin-right:4px}
.pill{border:1px solid var(--line);background:var(--chrome);border-radius:999px;padding:6px 12px;font-size:13px}
.pill.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill:disabled{opacity:.45;cursor:default}

/* 작업표시줄 */
#taskbar{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);z-index:6000;min-height:48px}
.start{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--chrome);border-radius:10px;padding:5px 12px 5px 6px}
.start .logo{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,#9fe08a 13% 45%,#2e9e5b 75%,#1a6b3c);box-shadow:inset 0 -2px 4px rgba(0,0,0,.25)}
.start span{font-family:var(--f-display);font-size:17px;letter-spacing:.02em}
.tb-btn{border:1px solid var(--line);background:var(--chrome);border-radius:10px;width:38px;height:36px;font-size:20px;line-height:1;display:grid;place-items:center}
.tasks{flex:1;display:flex;gap:6px;overflow-x:auto;min-width:0;scrollbar-width:none}
.tb-side{display:flex;align-items:center;gap:6px;min-width:0}
.tb-right{justify-content:flex-end}
#homeLogo{justify-self:center;border-color:transparent;background:transparent;padding:4px 10px 4px 6px}
#homeLogo:hover{background:var(--chrome-2);border-color:var(--line)}
#startBtn{font-size:18px}
.task{flex:none;max-width:180px;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.active{background:var(--chrome);border-color:var(--line)}
.status{font-size:12px;color:var(--ink-2);white-space:nowrap;display:flex;align-items:center;gap:6px}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.status.saving .dot{background:var(--warn)} .status.failed .dot{background:var(--danger)} .status.failed{color:var(--danger)}
.clock{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:42px;text-align:right}

/* 창 */
.win{position:absolute;z-index:100;display:flex;flex-direction:column;width:min(520px,calc(100vw - 24px));max-height:calc(100% - 24px);background:var(--chrome);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.win.wide{width:min(760px,calc(100vw - 24px))}
.win .tbar{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;background:linear-gradient(var(--chrome-2),var(--chrome));border-bottom:1px solid var(--line);cursor:grab;touch-action:none}
.win .tbar .tico{width:18px;height:18px;flex:none}
.win .tbar .tico svg{width:100%;height:100%}
.win .tbar h2{flex:1;margin:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win .x{border:0;background:transparent;width:32px;height:28px;border-radius:6px;font-size:18px;color:var(--ink-2)}
.win .x:hover{background:var(--danger);color:#fff}
.win .fz{border:1px solid var(--line);background:var(--chrome);border-radius:6px;height:26px;padding:0 10px;font-size:12px;color:var(--ink-2)}
.win.full{width:auto;right:0;border-radius:0;border-left:0;border-right:0;border-top:0;box-shadow:none}
.win.full .tbar{cursor:default}
.win.full .body{padding:40px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.win.full .post{max-width:720px;margin:0 auto}
.win.full .post h3{font-size:38px}
.win.full .post .txt{font-size:16.5px;max-width:none}
.win.full .foot{padding-left:max(16px,calc(50% - 360px));padding-right:max(16px,calc(50% - 360px))}
.win .body{flex:1;overflow:auto;padding:16px;user-select:text;-webkit-user-select:text}
.win .foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:10px 12px;border-top:1px solid var(--line);background:var(--chrome-2)}

.btn{border:1px solid var(--line);background:var(--chrome);border-radius:8px;padding:7px 14px;font-size:13.5px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:default}

.list{display:flex;flex-direction:column;min-width:0}
.list>.row{min-width:0}
.row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:hover{background:var(--chrome-2)}
.row .thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:none;background:var(--chrome-2);display:grid;place-items:center}
.row .thumb svg{width:30px;height:30px}
.row .meta{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:12px;color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums}
.tag{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.tag.draft{color:var(--warn);border-color:currentColor}
.tag.priv{color:var(--ink-2)}
.tag.broken{color:var(--danger);border-color:currentColor}
.vswitch{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:center}
.fcount{margin:0;font-size:12.5px;color:var(--ink-2)}
.fhead{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.linkbtn{margin-left:auto;border:0;background:none;color:var(--accent);font-size:13px;padding:4px 2px}
.win.large .body{padding:18px 22px}
.win.large .row{padding:12px 8px;gap:14px}
.win.large .row .thumb{width:64px;height:64px}
.win.large .row .thumb svg{width:40px;height:40px}
.win.large .row .t{font-size:15px}
.win.large .fgrid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:18px 8px}
.win.large .fi .ico{width:68px;height:68px}
.win.large .fi .lbl{font-size:13px}
.vswitch button{border:0;background:var(--chrome);padding:5px 12px;font-size:12.5px;color:var(--ink-2)}
.vswitch button+button{border-left:1px solid var(--line)}
.vswitch button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:14px 6px;padding:4px 0 8px}
.fi{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border:1px solid transparent;border-radius:6px;background:none;text-align:center}
.fi:hover{background:var(--select);border-color:var(--line)}
.fi .ico{width:56px;height:56px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.fi .ico svg{width:100%;height:100%}
.fi .lbl{font-size:12.5px;line-height:1.35;max-width:100%;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fi .chip{position:absolute;top:4px;right:10px;font-size:10px;padding:1px 5px;border-radius:8px;background:#1b2230;color:#fff}
.empty{padding:28px 8px;text-align:center;color:var(--ink-2);line-height:1.6}
.hint{font-size:12.5px;color:var(--ink-2);line-height:1.55}

.post h3{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.2;margin:0 0 6px;text-wrap:balance}
.post.untitled .d{font-size:13px}
.post .d{font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.post img{width:100%;border-radius:8px;margin:14px 0 4px;display:block}
.post .txt{line-height:1.75;font-size:15px;margin-top:14px;max-width:62ch;overflow-wrap:anywhere}

.form{display:grid;gap:12px}
.form label{display:grid;gap:5px;font-size:12.5px;color:var(--ink-2)}
.form input[type=text],.form textarea,.form select{border:1px solid var(--line);border-radius:8px;background:var(--chrome);padding:9px 10px;font-size:14.5px;color:var(--ink);width:100%}
.form textarea{min-height:180px;resize:vertical;line-height:1.65}
.form .inline{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--ink)}
.form .inline label{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink);white-space:nowrap}
.form .inline select{width:auto;min-width:120px}
.field{display:grid;gap:5px}.flabel{font-size:12.5px;color:var(--ink-2)}
.rte{border:1px solid var(--line);border-radius:8px;background:var(--chrome);overflow:hidden}
.rte:focus-within{border-color:var(--accent)}
.rte-bar{display:flex;flex-wrap:wrap;gap:2px;padding:4px;border-bottom:1px solid var(--line);background:var(--chrome-2)}
.rte-bar button{border:1px solid transparent;background:transparent;border-radius:6px;min-width:32px;height:30px;padding:0 8px;font-size:13px}
.rte-bar button:hover{background:var(--chrome);border-color:var(--line)}
.rte-sep{width:1px;background:var(--line);margin:4px 4px}
.rte-area{min-height:200px;max-height:46vh;overflow:auto;padding:12px 14px;font-size:15px;line-height:1.75;outline:none;user-select:text;-webkit-user-select:text;overflow-wrap:anywhere}
.rte-area:empty::before{content:attr(data-ph);color:var(--ink-2);opacity:.7}
.rte-area p,.post .txt p,.rte-area div{margin:0}
.rte-area blockquote,.post .txt blockquote{margin:10px 0;padding:6px 14px;border-left:3px solid var(--accent);background:var(--chrome-2);border-radius:0 6px 6px 0;color:var(--ink)}
.rte-area hr,.post .txt hr{border:0;border-top:1px solid var(--line);margin:18px 25%}
.blocks{max-height:52vh;overflow:auto}
.blocks .rte-area{min-height:0;max-height:none;padding:8px 14px}
.blocks .rte-area:first-child{min-height:120px;padding-top:12px}
.blocks .rte-area:last-child{min-height:56px;padding-bottom:14px}
.pblock{margin:4px 10px;padding:8px;border:1px dashed var(--line);border-radius:10px;background:var(--chrome-2)}
.pblock-head{display:flex;align-items:center;gap:4px;margin-bottom:6px;font-size:12px;color:var(--ink-2)}
.pblock-head span{flex:1}
.pblock-head button{border:1px solid var(--line);background:var(--chrome);border-radius:6px;padding:3px 8px;font-size:11.5px}
.pblock-head button:disabled{opacity:.4;cursor:default}
.prow-edit{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.rte-photo{display:inline-flex;align-items:center;height:30px;padding:0 10px;border-radius:6px;font-size:13px;color:var(--accent);cursor:pointer;border:1px solid transparent}
.rte-photo:hover{background:var(--chrome);border-color:var(--line)}
.prow{display:flex;gap:6px;margin:12px 0}
.prow .pfig{margin:0;min-width:0}
.prow .pfig img{width:100%;height:auto;object-fit:cover;border-radius:6px;display:block;margin:0}
.pbody .txt{margin-top:12px}
.ph-item{margin:0;display:grid;gap:6px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--chrome)}
.ph-item.is-cover{border-color:var(--accent);box-shadow:0 0 0 2px var(--select)}
.ph-img{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--chrome-2);max-width:100%}
.ph-img img{width:100%;height:100%;object-fit:cover;display:block}
.cover-badge{position:absolute;left:6px;top:6px;background:var(--accent);color:var(--accent-ink);font-size:11px;padding:1px 7px;border-radius:9px}
.ph-cap{border:1px solid var(--line);border-radius:6px;background:var(--chrome);padding:5px 7px;font-size:12.5px;width:100%;min-width:0}
.ph-acts{display:flex;gap:3px}
.ph-acts button{flex:1;border:1px solid var(--line);background:var(--chrome-2);border-radius:6px;padding:4px 0;font-size:11.5px;white-space:nowrap}
.ph-acts button:disabled{opacity:.4;cursor:default}
.ph-add{display:grid;place-items:center;align-content:center;gap:2px;min-height:140px;border:1px dashed var(--line);border-radius:10px;color:var(--ink);font-size:13px;cursor:pointer;text-align:center}
.ph-add .plus{font-size:24px;color:var(--accent)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;background:var(--select);font-size:13.5px}
.banner span{flex:1;min-width:180px}
.autosave{align-self:center}.autosave.fail{color:var(--danger)}
.pfig figcaption{overflow-wrap:anywhere}.pfig figcaption{font-size:12.5px;color:var(--ink-2);text-align:center;margin-top:6px}
.photo-prev{position:relative;max-width:220px}
.photo-prev img{width:100%;border-radius:8px;display:block}
.photo-prev button{position:absolute;top:6px;right:6px}

/* 메뉴 */
.menu{position:fixed;z-index:9000;min-width:210px;padding:5px;background:var(--chrome);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.menu [role=menuitem]{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:6px;text-align:left;font-size:13.5px}
.menu [role=menuitem]:hover,.menu [role=menuitem]:focus{background:var(--accent);color:var(--accent-ink);outline:none}
.menu [role=menuitem].danger{color:var(--danger)}
.menu [role=menuitem].danger:hover,.menu [role=menuitem].danger:focus{background:var(--danger);color:#fff}
.menu .sep{height:1px;background:var(--line);margin:4px 6px}
.menu .seg{display:flex;gap:4px;padding:2px 4px}
.menu .seg [role=menuitem]{justify-content:center;border:1px solid var(--line);padding:6px 4px}
.menu .seg [role=menuitem][aria-checked=true]{border-color:var(--accent);color:var(--accent)}
.menu .k{margin-left:auto;font-size:11.5px;opacity:.6}

/* 모달 */
.scrim{position:fixed;inset:0;z-index:8000;background:rgba(10,16,28,.35);display:grid;place-items:center;padding:16px}
.dialog{width:min(440px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--chrome);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px}
.dialog.wide{width:min(560px,100%)}
.dialog h3{margin:0 0 6px;font-size:16px}
.dialog p{margin:0 0 12px;color:var(--ink-2);line-height:1.6}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.dialog input[type=text],.dialog textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--chrome);padding:9px 10px;font-size:14.5px}
.dialog textarea{min-height:110px;resize:vertical;line-height:1.6}
.rs-unit{display:flex;gap:16px;margin:4px 0 10px;font-size:13.5px}

/* 글 화면 */

    ]}]};

function el(type,target,appearance,x,y,size){const w=size||88;return{id:uid("el"),type,target,appearance:Object.assign({labelMode:"targetTitle"},appearance),placement:{mode:"absolute",x,y,width:w,height:w+20,rotation:0,zIndex:nextZ()}}}
function nextZ(){if(!layout)return 1;return Math.max(0,...page().elements.map(e=>P(e).zIndex||0))+1}
function page(){return layout.pages[0]}
/* 배치는 기기마다 따로: PC는 placement, 휴대폰은 placementM(폭 390 기준 세로로 긴 종이) */
const MW=390;
const P=e=>isMobile()?(e.placementM||(autoM(),e.placementM)):e.placement;
/* 휴대폰 배치가 아직 없는 물건은 한 번만, PC 배치 순서대로 아래에 이어 놓음 */
function estHM(e){const t=e.type;if(t==="me")return 128;if(t==="recent")return 70+Math.min(5,Math.max(1,records.posts.filter(postVisible).length))*62;
  if(t==="text")return 40+Math.ceil(((e.appearance.text||"").length+ (e.appearance.text||"").split("\n").length*14)/22)*22;return 112}
function autoM(){const els=page().elements;const todo=els.filter(e=>!e.placementM);if(!todo.length)return;
  let y=Math.max(16,...els.filter(e=>e.placementM).map(e=>e.placementM.y+estHM(e)+12));
  const rank=e=>e.type==="me"?0:e.type==="text"?2:e.type==="recent"?3:1;
  todo.sort((a,b)=>rank(a)-rank(b)||a.placement.y-b.placement.y||a.placement.x-b.placement.x);
  let col=0;const icon=e=>!["me","text","recent"].includes(e.type);
  todo.forEach(e=>{const z=e.placement.zIndex||1;
    if(icon(e)){const w=e.type==="image"?Math.min(e.placement.width,112):Math.min(e.placement.width,88);
      if(col===4){col=0;y+=112}
      e.placementM={mode:"absolute",x:10+col*94,y,width:w,height:w+20,rotation:0,zIndex:z};col++}
    else{if(col){col=0;y+=112}
      e.placementM={mode:"absolute",x:16,y,width:MW-32,height:estHM(e),rotation:0,zIndex:z};y+=estHM(e)+14}});
  if(col)y+=112}

function load(){
  records=lsGet(K.records);layout=lsGet(K.layout);assets=lsGet(K.assets)||{};
  if(!records||!layout){defaults();persist(true);ui.onboard=true}

/* 예전 형식(본문 글자 + 사진 1장) → 새 형식(꾸민 본문 + 사진 여러 장) */
function migrate(){
  let changed=false;
  /* 카테고리 공개 범위 = 그 카테고리에 쓰는 글의 기본값. 예전 '비공개 카테고리' 안의 글은 그대로 안 보이게 나만 보기로 */
  if(!records.settings||!records.settings.catVisV1){records.settings=Object.assign({},records.settings||{},{catVisV1:true});
    records.categories.forEach(c=>{if(c.visibility!=="private")return;records.posts.forEach(p=>{if(p.categoryId===c.id&&p.visibility!=="private"){p.visibility="private";changed=true}})});changed=true}
  records.posts.forEach(p=>{
    if(p.bodyJson)return;
    const html=p.bodyHtml!=null?p.bodyHtml:esc(p.body||"").replace(/\n/g,"<br>");
    const photos=p.photos||(p.photoAssetId?[{assetId:p.photoAssetId,caption:""}]:[]);
    const blocks=[{id:uid("b"),type:"text",html}];if(photos.length)blocks.push({id:uid("b"),type:"photos",items:photos});
    p.bodyJson={version:2,blocks};if(!p.coverAssetId&&p.photoAssetId)p.coverAssetId=p.photoAssetId;
    delete p.body;delete p.bodyHtml;delete p.photos;delete p.photoAssetId;changed=true;
  });
  /* 어디에서도 쓰지 않는 사진 정리 (임시저장 중인 사진은 남김) */
  const used=new Set();(layout.shelf||[]).forEach(x=>{if(x.assetId)used.add(x.assetId)});
  records.posts.forEach(p=>{mediaIds(blocksOf(p)).forEach(x=>used.add(x));p.coverAssetId&&used.add(p.coverAssetId)});extraUsedIds().forEach(x=>used.add(x));
  records.profile.photoAssetId&&used.add(records.profile.photoAssetId);
  page().elements.forEach(e=>{const ic=e.appearance&&e.appearance.icon;ic&&ic.kind==="asset"&&used.add(ic.assetId)});
  const bg=page().background;bg.type==="image"&&used.add(bg.assetId);
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("mgd2.v1.autosave.")){const a=lsGet(k);if(a&&a.draft)mediaIds(draftToBlocks(a.draft)).forEach(x=>used.add(x))}}}catch(e){}
  Object.keys(assets).forEach(id=>{if(!used.has(id)){delete assets[id];changed=true}});
  /* '나' 위젯과 '전체' 입구: 홈에 늘 있음 (지울 수 없음) */
  if(!layout.meV1){layout.meV1=true;const els=page().elements;
    if(!els.some(e=>e.type==="me"))els.push({id:uid("el"),type:"me",target:null,appearance:{},placement:{mode:"absolute",x:REF_W-352,y:24,width:320,height:124,rotation:0,zIndex:nextZ()}});
    if(!els.some(e=>e.type==="all")){const at=freeSpot();els.push(el("all",null,{},at.x,at.y))}
    changed=true}
  if(!layout.recentV1){layout.recentV1=true;const els=page().elements;
    if(!els.some(e=>e.type==="recent"))els.push({id:uid("el"),type:"recent",target:null,appearance:{},placement:{mode:"absolute",x:REF_W-352,y:172,width:320,height:360,rotation:0,zIndex:nextZ()}});changed=true}
  const bgp=page().background;
  /* 종이 질감 배경으로 한 번 바꿈 (예전에 고른 배경과 상관없이). 이후에 다시 고른 배경은 유지 */
  if(!layout.bgDefaultV3){layout.bgDefaultV2=true;layout.bgDefaultV3=true;page().background={type:"preset",value:"paper-tex"};changed=true}
  if(changed)persist(true);
}
let saveTimer=null;
function persist(silent){
  setStatus("saving");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(writeAll,silent?0:180);
}
/* 바로 저장하고 성공 여부를 돌려줌 */
function writeAll(){
  clearTimeout(saveTimer);
  const prev={};try{[K.records,K.layout,K.assets].forEach(k=>prev[k]=localStorage.getItem(k))}catch(e){}
  /* 쓰는 순서: 새 첨부가 생길 땐 첨부 → 배치 → 글, 첨부를 지울 땐 글 → 배치 → 첨부.
     어느 단계에서 브라우저가 꺼져도 글이 없는 첨부를 가리키는 일이 없게 (남는 첨부는 다음 정리 때 지워짐) */
  if(!writeAll.lastIds)writeAll.lastIds=new Set(Object.keys(lsGet(K.assets)||{}));
  const removed=[...writeAll.lastIds].some(id=>!(id in assets));
  const parts={[K.records]:JSON.stringify(records),[K.layout]:JSON.stringify(layout),[K.assets]:JSON.stringify(assets)};
  const order=removed?[K.records,K.layout,K.assets]:[K.assets,K.layout,K.records];
  try{
    order.forEach((k,i)=>{if(window.__mgdCrashAt===i){const e=new Error("시험: 저장 중 꺼짐");e.crash=true;throw e}localStorage.setItem(k,parts[k])});
    writeAll.lastIds=new Set(Object.keys(assets));
    setStatus("saved");return true;
  }catch(e){
    if(e&&e.crash)return false;   /* 시험용: 브라우저가 갑자기 꺼진 것처럼 되돌리기도 못 함 */
    try{Object.entries(prev).forEach(([k,v])=>{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)})}catch(x){}
    const quota=e&&(e.name==="QuotaExceededError"||e.code===22);
    setStatus("failed",quota?"저장 실패 · 브라우저 저장공간이 가득 찼어요. 사진을 줄여 주세요":"저장 실패 · 이 브라우저는 저장을 막고 있어요");
    return false;
  }
}
function setStatus(s,msg){if(s==="failed"&&ui.save!=="failed"&&isMobile())setTimeout(()=>toast(msg),0);ui.save=s;ui.saveMsg=msg||"";const st=$("#status");st.className="status "+s;
  st.querySelector("span").textContent=s==="saving"?"저장 중…":s==="failed"?msg:"저장됨 · 이 브라우저";
  if(ui.mode==="edit")renderTopbar();}
function commit(){persist();render();refreshWindows()}

/* ───────── 조회 ───────── */
const cat=id=>records.categories.find(c=>c.id===id);
const post=id=>records.posts.find(p=>p.id===id);
const isVisitor=()=>ui.viewer==="visitor";
/* 글 날짜: 사용자가 정한 날짜(recordedAt). 실제 작성·발행 시각(createdAt, firstPublishedAt)은 따로 남고 바뀌지 않음 */
const settings=()=>Object.assign({showDates:true,showVisTags:true},records.settings||{});
const dateOf=p=>p.recordedAt||(p.firstPublishedAt||p.updatedAt||"").slice(0,10);
const showDateOf=p=>p.showDate!=null?p.showDate:settings().showDates;
const byDate=(a,b)=>dateOf(b).localeCompare(dateOf(a))||(b.createdAt||b.updatedAt||"").localeCompare(a.createdAt||a.updatedAt||"");
function fmtDay(d){if(!d)return"";const [y,m,dd]=d.slice(0,10).split("-");return `${y}.${m}.${dd}`}
const VIS={public:"전체 공개",followers:"팔로워만",close:"가까운 사람",custom:"지정한 사람만",private:"나만 보기"};
function visTag(p,long){if(isVisitor()||!settings().showVisTags)return"";
  if(p.status==="draft")return `<span class="tag draft">${long?"초안 · 나만 보여요":"초안"}</span>`;
  if(p.visibility==="public")return long?`<span class="tag">전체 공개</span>`:"";
  const t=p.visibility==="custom"&&p.allow&&p.allow.length?`${p.allow.slice(0,2).join(", ")}${p.allow.length>2?` 외 ${p.allow.length-2}명`:""}만`:VIS[p.visibility]||"비공개";
  return `<span class="tag priv">${esc(t)}</span>`}
const postVisible=p=>p&&(!isVisitor()||(p.status==="published"&&VIEWAS[ui.viewAs||"stranger"].includes(p.visibility)));
const catVisible=c=>c&&(!isVisitor()||records.posts.some(p=>p.categoryId===c.id&&postVisible(p)));
/* 카테고리의 기본 공개 범위. 미분류는 처음에 고른 기본값 */
const catDefault=id=>(id&&cat(id)&&VIS[cat(id).visibility]?cat(id).visibility:null)||settings().defaultVis||"public";
const VRANK={private:0,custom:1,close:1.5,followers:2,public:3};
/* 가까운 사람: 내가 고른 몇 명. 누가 들어 있는지는 나만 앎 */
const closeIds=()=>(records.settings&&records.settings.close)||[];
const authorName=id=>{const a=SAMPLE_AUTHORS.find(x=>x.id===id);return a?a.name:id};
/* 방문자 미리보기: 누구로 볼지 (모르는 사람 · 팔로워 · 가까운 사람) */
const VIEWAS={stranger:["public"],follower:["public","followers"],close:["public","followers","close"]};
/* 받침에 맞는 조사: ‘팔로워만’이에요 / ‘전체 공개’예요, ‘팔로워만’으로 / ‘전체 공개’로 */
const jong=w=>{const c=(w||"").charCodeAt(w.length-1)-0xac00;return c>=0&&c<11172?c%28:0};
const EY=w=>`‘${w}’${jong(w)?"이에요":"예요"}`,RO=w=>`‘${w}’${jong(w)&&jong(w)!==8?"으로":"로"}`;
function postsIn(catId){
  return records.posts.filter(p=>(p.categoryId||null)===(catId||null)&&postVisible(p)&&(catId?true:true))
   .sort((a,b)=>{if(a.status!==b.status)return a.status==="draft"?-1:1;return byDate(a,b)});
}
function iconHTML(ap){const ic=ap&&ap.icon;if(ic&&ic.kind==="asset"&&assets[ic.assetId])return `<img src="${assets[ic.assetId].dataUrl}" alt="">`;return (ICONS[(ic&&ic.name)]||ICONS.document).svg}
function resolve(e){
  if(e.type==="categoryShortcut"){const c=cat(e.target.id);if(!c)return{broken:true,label:"연결 끊긴 폴더"};
    return{label:c.name,obj:c,visible:catVisible(c),priv:c.visibility==="private"}}
  if(e.type==="postShortcut"){const p=post(e.target.id);if(!p)return{broken:true,label:"연결 끊긴 글"};
    const label=e.appearance.labelMode==="custom"&&e.appearance.label?e.appearance.label:titleOf(p);
    return{label,obj:p,visible:postVisible(p),draft:p.status==="draft",priv:p.visibility!=="public"}}
  if(e.type==="image")return{label:"",visible:true};
  if(e.type==="me")return{label:records.profile.displayName,visible:true};
  if(e.type==="all")return{label:"글",visible:true};
  if(e.type==="recent")return{label:"최근 글",visible:true};
  if(e.type==="text")return{label:e.appearance.text,visible:true};
  return{unknown:true,label:"알 수 없는 요소",visible:!isVisitor()};
}

/* 지난 오늘: 글 날짜(내가 정한 날짜)가 오늘과 같은 달·일인 지난해 글. 주인에게만 보임 */
function onThisDay(){const t=new Date(),md=`${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`,y=t.getFullYear();
  return records.posts.filter(p=>p.status==="published"&&(dateOf(p)||"").slice(5,10)===md&&+(dateOf(p)||"").slice(0,4)<y).sort(byDate)}
const yearsAgo=p=>new Date().getFullYear()-+dateOf(p).slice(0,4);
const agoRow=(p,txt)=>rowHTML(p).replace('<span class="meta">',`<span class="meta"><span class="ago">${txt}</span>`);
function otdHTML(){if(isVisitor())return"";const ps=onThisDay();if(!ps.length)return"";
  return `<section class="recent otd"><h2>지난 오늘</h2><div class="list">${ps.map(p=>agoRow(p,`${yearsAgo(p)}년 전 오늘`)).join("")}</div></section>`}
const OTD_HIDE="mgd2.v1.otdHidden";
function otdCardHTML(){if(isVisitor()||isMobile()||ui.mode==="edit")return"";const ps=onThisDay();if(!ps.length)return"";
  if(lsGet(OTD_HIDE)===new Date().toDateString())return"";
  const p=ps[0],cv=coverOf(p);
  return `<aside class="otd-card" aria-label="지난 오늘 글"><button type="button" class="otd-x" data-act="otdHide" aria-label="오늘은 그만 보기" title="오늘은 그만 보기">×</button>
    <span class="otd-l">${yearsAgo(p)}년 전 오늘</span>
    <button type="button" class="otd-p" data-open-post="${p.id}">${cv?`<img src="${cv.dataUrl}" alt="">`:""}<span>${esc(titleOf(p))}</span></button>
    ${ps.length>1?`<button type="button" class="otd-more" data-act="openOtd">이날 쓴 글 모두 보기 ›</button>`:""}</aside>`}
function openOtd(){openWin("otd",{title:"지난 오늘 글",icon:ICONS.document.svg,render(body){const ps=onThisDay(),t=new Date();
  body.innerHTML=`<p class="otd-date">${t.getMonth()+1}월 ${t.getDate()}일</p>`+
    (ps.length?`<div class="list">${ps.map(p=>agoRow(p,`${yearsAgo(p)}년 전`)).join("")}</div>`:`<p class="empty">아직 이날 쓴 지난 글이 없어요. 글을 쓸 때 날짜를 지난해 오늘로 정해 두면 여기에 모여요.</p>`)}})}
/* 대표 글: 주인이 직접 고른 글 3개까지. 내 공간에서 맨 먼저 보임 (조회수로 정하는 '인기글'은 없음) */
const featured=()=>(records.profile.featured||[]).map(post).filter(p=>p&&p.status==="published"&&postVisible(p));

  const node=document.createElement("section");node.className="win"+(opts.wide?" wide":"");node.setAttribute("role","dialog");node.setAttribute("aria-label",opts.title);
  const dw=$("#desk").clientWidth,dh=$("#desk").clientHeight;

  let x=Math.max(12,Math.min(dw-ww-12,dw/2-ww/2+cascade*28-40)),y=Math.max(12,40+cascade*28);
  if(opts.large){ww=Math.min(920,dw-32);const hh=Math.min(680,dh-32);x=Math.max(12,Math.round(dw/2-ww/2)+cascade*24);y=Math.max(12,Math.round((dh-hh)/2)+cascade*24);
    node.classList.add("large");if(!isMobile()){node.style.width=ww+"px";node.style.height=Math.min(hh,dh-y-12)+"px"}}

function normBlocks(bs){
  const a=bs.filter(b=>!(b.type==="photos"&&!b.items.length));
  const out=[];
  a.forEach(b=>{const last=out[out.length-1];
    if(b.type!=="text"){if(!last||last.type!=="text")out.push(blankText());out.push(b)}
    else{if(last&&last.type==="text"&&isBlankHtml(b.html))return;if(last&&last.type==="text"&&isBlankHtml(last.html))out.pop();out.push(b)}});
  if(!out.length||out[out.length-1].type!=="text")out.push(blankText());
  if(out[0].type!=="text")out.unshift(blankText());
  return out;
}

  m.innerHTML=items.map(it=>{if(it==="-")return`<div class="sep" role="separator"></div>`;
    if(it.seg)return`<div class="seg" role="group" aria-label="${esc(it.label)}">${it.seg.map((s,i)=>`<button role="menuitem" aria-checked="${!!s.on}" data-i="${it._i=items.indexOf(it)}" data-s="${i}">${esc(s.label)}</button>`).join("")}</div>`;
    return`<button role="menuitem" class="${it.danger?"danger":""}" data-i="${items.indexOf(it)}">${esc(it.label)}${it.key?`<span class="k">${esc(it.key)}</span>`:""}</button>`}).join("");
  document.body.appendChild(m);menuNode=m;
  const r=m.getBoundingClientRect();const vw=innerWidth,vh=innerHeight;
  m.style.left=Math.max(6,Math.min(x,vw-r.width-6))+"px";m.style.top=Math.max(6,Math.min(y,vh-r.height-6))+"px";
  const btns=[...m.querySelectorAll("[role=menuitem]")];btns[0]&&btns[0].focus();
  m.addEventListener("click",e=>{const b=e.target.closest("[role=menuitem]");if(!b)return;const it=items[+b.dataset.i];closeMenu();returnFocus&&returnFocus.focus&&returnFocus.focus();
    if(it.seg)it.seg[+b.dataset.s].run();else it.run()});
  m.addEventListener("keydown",e=>{const i=btns.indexOf(document.activeElement);
    if(e.key==="ArrowDown"||e.key==="ArrowRight"&&document.activeElement.parentElement.classList.contains("seg")){e.preventDefault();btns[(i+1)%btns.length].focus()}
    else if(e.key==="ArrowUp"||e.key==="ArrowLeft"&&document.activeElement.parentElement.classList.contains("seg")){e.preventDefault();btns[(i-1+btns.length)%btns.length].focus()}
    else if(e.key==="Escape"||e.key==="Tab"){e.preventDefault();closeMenu();returnFocus&&returnFocus.focus&&returnFocus.focus()}});
}
function deskPoint(cx,cy){const d=$("#desk"),r=d.getBoundingClientRect(),s=isMobile()?1:scale();

const snap=v=>Math.round(v/GRID)*GRID;
function freeSpot(){const els=page().elements;for(let x=48;x<REF_W-120;x+=112)for(let y=48;y<640;y+=112){if(!els.some(e=>Math.abs(e.placement.x-x)<90&&Math.abs(e.placement.y-y)<100))return{x,y}}return{x:48,y:48}}

function resize(e,w){pushUndo();P(e).width=w;P(e).height=w+20;commit()}
/* 그림판의 '크기 조정'처럼: 백분율 또는 픽셀, 바꾸는 동안 바로 보임. 가로·세로 비율은 유지 */
const BASE_W=88,MIN_W=40,MAX_W=320;
function resizeDialog(e){
  const orig=P(e).width;let unit="pct";
  const apply=w=>{w=Math.max(MIN_W,Math.min(MAX_W,Math.round(w)));P(e).width=w;P(e).height=w+20;render();return w};
  modal(`<h3>크기 조정</h3><p>가로·세로 비율은 그대로 두고 크기만 바꿔요. 기본 크기가 100%예요.</p>
    <div class="rs-unit" role="radiogroup" aria-label="단위"><label><input type="radio" name="rs-unit" value="pct" checked> 백분율</label><label><input type="radio" name="rs-unit" value="px"> 픽셀</label></div>
    <input type="range" id="rs-range" min="${MIN_W}" max="${MAX_W}" step="1" value="${orig}" aria-label="크기">
    <div class="rs-row"><label for="rs-num">크기</label><input type="number" id="rs-num" inputmode="numeric"><span id="rs-u">%</span>
      <span class="rs-quick"><button type="button" class="btn" data-q="64">작게</button><button type="button" class="btn" data-q="88">보통</button><button type="button" class="btn" data-q="128">크게</button><button type="button" class="btn" data-q="192">아주 크게</button></span></div>
    <div class="acts"><button class="btn" data-c>취소</button><button class="btn primary" data-o>확인</button></div>`);
  const s=modal.cur,rg=$("#rs-range",s),num=$("#rs-num",s),u=$("#rs-u",s);
  const show=w=>{rg.value=w;num.value=unit==="pct"?Math.round(w/BASE_W*100):w;
    num.min=unit==="pct"?Math.round(MIN_W/BASE_W*100):MIN_W;num.max=unit==="pct"?Math.round(MAX_W/BASE_W*100):MAX_W;u.textContent=unit==="pct"?"%":"px"};
  show(orig);
  rg.oninput=()=>show(apply(+rg.value));
  num.oninput=()=>{const v=+num.value;if(!v)return;const w=unit==="pct"?v/100*BASE_W:v;const got=apply(w);rg.value=got};
  num.onchange=()=>show(P(e).width);
  num.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();s.querySelector("[data-o]").click()}});
  s.querySelectorAll('input[name="rs-unit"]').forEach(r=>r.onchange=()=>{unit=r.value;show(P(e).width)});
  s.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>show(apply(+b.dataset.q)));
  const finish=ok=>{const w=P(e).width;P(e).width=orig;P(e).height=orig+20;
    if(ok&&w!==orig){pushUndo();P(e).width=w;P(e).height=w+20;commit()}else render();s._done(null)};
  s.querySelector("[data-c]").onclick=()=>finish(false);
  s.querySelector("[data-o]").onclick=()=>finish(true);
  /* 바깥 클릭·Esc로 닫으면 취소 */
  const obs=new MutationObserver(()=>{if(!document.body.contains(s)){obs.disconnect();if(P(e).width!==orig&&!s._finished){P(e).width=orig;P(e).height=orig+20;render()}}});
  obs.observe(document.body,{childList:true});
  const _d=s._done;s._done=v=>{s._finished=true;_d(v)};
  setTimeout(()=>{num.focus();num.select()},30);
}

async function catSettings(id){
  const c=cat(id);if(!c)return;const old=catDefault(id);
  const follow=records.posts.filter(p=>p.categoryId===id&&!p.visOwn);
  const p=modal(`<h3>카테고리 설정</h3>
    <label class="m-vis">이름 <input type="text" id="cs-name" value="${esc(c.name)}" maxlength="30"></label>
    <label class="m-vis">기본 공개 범위 <select id="cs-vis">${Object.entries(VIS).map(([v,t])=>`<option value="${v}" ${old===v?"selected":""}>${t}</option>`).join("")}</select></label>
    <div class="cs-apply" hidden>
      <label class="chk"><input type="radio" name="cs-ap" value="new" checked> 앞으로 쓰는 글만</label>
      <label class="chk"><input type="radio" name="cs-ap" value="all"> 이미 쓴 글 ${follow.length}개도 함께${records.posts.some(p=>p.categoryId===id&&p.visOwn)?" (따로 정한 글은 그대로)":""}</label>
    </div>

    <div class="acts"><button class="btn danger" data-del>카테고리 삭제</button><span style="flex:1"></span><button class="btn" data-c>취소</button><button class="btn primary" data-o>저장</button></div>`);
  const m=modal.cur,ap=m.querySelector(".cs-apply"),warn=m.querySelector(".po-warn");

    const all=m.querySelector('input[name="cs-ap"]:checked').value==="all";
    const wid=ch&&all&&follow.some(x=>VRANK[v]>VRANK[x.visibility]);warn.hidden=!wid;if(wid)warn.textContent=`이미 쓴 글이 ${RO(VIS[v])} 바뀌어 더 많은 사람이 보게 돼요.`};
  $("#cs-vis",m).onchange=upd;m.querySelectorAll('input[name="cs-ap"]').forEach(r=>r.onchange=upd);upd();
  m.querySelector("[data-c]").onclick=()=>m._done(null);

  const r=await p;if(!r)return;if(r.del){deleteCategory(id);return}

  commit();toast(r.v===old?"저장했어요.":moved?`기본값을 ${RO(VIS[r.v])} 바꾸고, 글 ${moved}개도 함께 바꿨어요.`:`기본값을 ${RO(VIS[r.v])} 바꿨어요. 이미 쓴 글은 그대로예요.`)}

function sampleImg(kind,w,h,seed){

  const W=360,Hh=Math.round(W*h/w),c=document.createElement("canvas");c.width=W;c.height=Hh;const x=c.getContext("2d");

  else if(kind==="bread"){grad("#f6ead6","#e2cfae");x.fillStyle="#c98b54";for(let i=0;i<3;i++){x.beginPath();x.ellipse(W*(.25+i*.25),Hh*(.45+rnd()*.15),W*.11,Hh*.08,rnd(),0,7);x.fill()}x.fillStyle="rgba(255,255,255,.35)";x.fillRect(0,0,W,Hh*.12)}

function pfClean(list,limit=12){return (Array.isArray(list)?list:[]).slice(0,limit).filter(g=>g&&typeof g==='object').map(g=>({id:String(g.id||uid('pf')),name:String(g.name||'내 기능').slice(0,40),fields:(Array.isArray(g.fields)?g.fields:[]).slice(0,20).filter(f=>f&&typeof f==='object').map(f=>({id:String(f.id||uid('pff')),name:String(f.name||'항목').slice(0,40),type:Object.hasOwn(PF_TYPES,f.type)?f.type:'text',options:(Array.isArray(f.options)?f.options:[]).slice(0,20).map(x=>String(x).slice(0,60)),value:String(f.value??'').slice(0,2000)}))}))}
const pfBlank=g=>{const n=pfClean([g])[0];n.id=uid('pf');n.fields.forEach(f=>{f.id=uid('pff');f.value=''});return n};
const pfPresets=[{name:'물건 정보',fields:[{name:'구매한 날',type:'date'},{name:'보관 장소',type:'text'}]}, {name:'독서 기록',fields:[{name:'책 이름',type:'text'},{name:'읽은 상태',type:'select',options:['읽고 싶음','읽는 중','다 읽음']},{name:'기억할 문장',type:'text'}]}, {name:'직접 만들기',fields:[{name:'',type:'text'}]}];
function pfTemplateSave(group){return askText('내 기능으로 저장',group.name,{hint:'이름과 항목 구성만 저장해요. 이 글에 입력한 값은 포함하지 않아요.',ok:'저장'}).then(name=>{if(name==null||!name.trim())return;const before=clone(records.functionTemplates||[]);if(before.length>=40){toast('내 기능은 40개까지 저장할 수 있어요. 쓰지 않는 기능을 먼저 삭제해 주세요.');return}const t=pfBlank(group);t.name=name.trim().slice(0,40);records.functionTemplates=[...before,t];if(!writeAll()){records.functionTemplates=before;toast('저장하지 못했어요. 다시 시도해 주세요.');return}toast('내 기능에 저장했어요. 다른 글에서도 가져올 수 있어요.')})}
function pfConfigure(source){const g=pfClean([source])[0];return new Promise(resolve=>{const task=modal(`<h3>기능 구성</h3><p class="hint">추가한 정보는 이 글을 볼 수 있는 사람에게 함께 보여요.</p><label>기능 이름 <input data-pf-name maxlength="40" value="${esc(g.name)}"></label><div class="pf-config"></div><button class="btn" data-pf-field>항목 추가</button><p class="pf-error" role="alert"></p><div class="acts"><button class="btn" data-c>취소</button><button class="btn primary" data-pf-apply>적용</button></div>`);const m=modal.cur,box=m.querySelector('.pf-config');
 const draw=()=>{box.innerHTML=g.fields.map((f,i)=>`<div class="pf-field" data-i="${i}"><label>항목 이름<input data-name maxlength="40" value="${esc(f.name)}"></label><label>형식<select data-type>${Object.entries(PF_TYPES).map(([v,l])=>`<option value="${v}" ${f.type===v?'selected':''}>${l}</option>`).join('')}</select></label><label ${f.type==='select'?'':'hidden'} data-choices>선택지 (쉼표로 구분)<input data-options maxlength="1200" value="${esc(f.options.join(', '))}"></label><button class="btn" data-remove>항목 삭제</button></div>`).join('');box.querySelectorAll('.pf-field').forEach(row=>{const f=g.fields[+row.dataset.i];row.querySelector('[data-name]').oninput=e=>f.name=e.target.value;row.querySelector('[data-options]').oninput=e=>f.options=e.target.value.split(',').map(x=>x.trim()).filter(Boolean);row.querySelector('[data-type]').onchange=e=>{f.type=e.target.value;f.value='';row.querySelector('[data-choices]').hidden=f.type!=='select'};row.querySelector('[data-remove]').onclick=()=>{g.fields.splice(+row.dataset.i,1);draw()}})};draw();
 m.querySelector('[data-pf-field]').onclick=()=>{if(g.fields.length>=20)return;g.fields.push({id:uid('pff'),name:'',type:'text',options:[],value:''});draw();box.lastElementChild.querySelector('input').focus()};
 m.querySelector('[data-c]').onclick=()=>m._done(null);m.querySelector('[data-pf-apply]').onclick=()=>{g.name=m.querySelector('[data-pf-name]').value.trim();const error=!g.name?'기능 이름을 적어 주세요.':!g.fields.length?'항목을 하나 이상 추가해 주세요.':g.fields.some(f=>!f.name.trim())?'항목 이름을 적어 주세요.':g.fields.some(f=>f.type==='select'&&(!f.options.length||f.options.length>20))?'선택지는 1개에서 20개까지 적어 주세요.':'';m.querySelector('.pf-error').textContent=error;if(error)return;g.fields.forEach(f=>{f.name=f.name.trim();f.options=[...new Set(f.options)];if(f.type==='select'&&!f.options.includes(f.value))f.value=''});m._done(pfClean([g])[0])};task.then(resolve)})}
function pfPick(){return new Promise(resolve=>{const task=modal(`<h3>기능 추가</h3><p class="hint">필요한 정보만 붙여요. 항목 이름과 형식은 바꿀 수 있어요.</p><h4>기본 기능</h4><div class="pf-options">${pfPresets.map((g,i)=>`<button class="btn" data-preset="${i}">${esc(g.name)}</button>`).join('')}</div><h4>내 기능</h4><div data-pf-library></div><div class="acts"><button class="btn" data-c>닫기</button></div>`);const m=modal.cur;
 const draw=()=>{const list=pfClean(records.functionTemplates,40);m.querySelector('[data-pf-library]').innerHTML=list.length?list.map((g,i)=>`<div class="pf-head"><button class="btn pf-name" data-saved="${i}">${esc(g.name)}</button><button class="btn" data-del="${i}" aria-label="${esc(g.name)} 내 기능 삭제">삭제</button></div>`).join(''):'<p class="hint">기능을 구성한 뒤 ‘내 기능으로 저장’을 누르면 여기에 모여요.</p>';m.querySelectorAll('[data-saved]').forEach(b=>b.onclick=()=>m._done(pfBlank(list[+b.dataset.saved])));m.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const before=clone(records.functionTemplates||[]);records.functionTemplates=before.filter((_,i)=>i!==+b.dataset.del);if(!writeAll()){records.functionTemplates=before;toast('삭제하지 못했어요.');return}draw();toast('내 기능에서 삭제했어요. 글에 붙인 기능은 그대로예요.')})};draw();m.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>m._done(pfBlank(pfPresets[+b.dataset.preset])));m.querySelector('[data-c]').onclick=()=>m._done(null);task.then(resolve)})}
const pfBaseSetup=edSetup;edSetup=function(ctx){pfBaseSetup(ctx);ctx.draft.functions=pfClean(ctx.draft.functions);const host=document.createElement('section');host.className='pf-editor';host.innerHTML='<div data-pf-groups></div><button class="btn" type="button" data-pf-add>＋ 기능 추가</button>';ctx.body.querySelector('form').appendChild(host);const list=host.querySelector('[data-pf-groups]');
 const draw=()=>{list.innerHTML=ctx.draft.functions.map((g,i)=>`<section class="pf-card" data-pf-index="${i}"><div class="pf-head"><strong class="pf-name">${esc(g.name)}</strong><button type="button" class="btn" data-config>구성</button><button type="button" class="btn" data-template>내 기능으로 저장</button><button type="button" class="btn" data-delete>빼기</button></div><div class="pf-fields">${g.fields.map((f,j)=>`<label>${esc(f.name)}${f.type==='select'?`<select data-value="${j}"><option value="">선택 안 함</option>${f.options.map(o=>`<option value="${esc(o)}" ${f.value===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input data-value="${j}" type="${f.type==='text'?'text':f.type}" ${f.type==='number'?'step="any"':''} maxlength="2000" value="${esc(f.value)}">`}</label>`).join('')}</div></section>`).join('');list.querySelectorAll('[data-pf-index]').forEach(card=>{const i=+card.dataset.pfIndex,g=ctx.draft.functions[i];card.querySelectorAll('[data-value]').forEach(input=>{input.oninput=input.onchange=()=>{g.fields[+input.dataset.value].value=input.value;ctx.queueAuto()}});card.querySelector('[data-config]').onclick=async()=>{const updated=await pfConfigure(g);if(!updated||!host.isConnected)return;ctx.draft.functions[i]=updated;draw();ctx.queueAuto()};card.querySelector('[data-template]').onclick=()=>pfTemplateSave(g);card.querySelector('[data-delete]').onclick=()=>{ctx.draft.functions.splice(i,1);draw();ctx.queueAuto()}})};draw();host.querySelector('[data-pf-add]').onclick=async()=>{if(ctx.draft.functions.length>=12){toast('한 글에는 기능을 12개까지 붙일 수 있어요.');return}const selected=await pfPick();if(!selected||!host.isConnected)return;const g=await pfConfigure(selected);if(!g||!host.isConnected)return;ctx.draft.functions.push(g);draw();ctx.queueAuto()}};
const pfBaseBody=renderBody;renderBody=function(p){return pfBaseBody(p)+pfClean(p?.functions).filter(g=>g.fields.some(f=>f.value!=='')).map(g=>`<section class="pf-card pf-view"><strong>${esc(g.name)}</strong><dl>${g.fields.filter(f=>f.value!=='').map(f=>`<dt>${esc(f.name)}</dt><dd>${esc(f.value)}</dd>`).join('')}</dl></section>`).join('')};

render();
/* PC·모바일을 나란히 볼 때: 한쪽에서 저장하면 다른 쪽도 다시 그림 */
addEventListener("storage",ev=>{if(!ev.key||!ev.key.startsWith("mgd2.v1."))return;if(ev.key.startsWith("mgd2.v1.autosave."))return;
  if(drag)return;const r=lsGet(K.records),l=lsGet(K.layout),a=lsGet(K.assets);if(!r||!l)return;
  records=r;layout=l;assets=a||{};ui.onboard=records.settings?.onboardingComplete===false;render();refreshWindows()});
})();
</script>
</body></html>
